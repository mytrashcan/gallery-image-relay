name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Lint
        run: ruff check .
      - name: Import and configuration check
        run: python scripts/check_install.py
      - name: Shell syntax
        if: runner.os == 'Linux'
        run: |
          bash -n deploy_oci.sh
          bash -n dcselfie.sh
      - name: Test
        run: pytest
